<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>💰 Expense Tracker</h1>

    <div class="form">

        <label>Expense Name</label>
        <input type="text" id="n" placeholder="Enter expense name">

        <label>Amount</label>
        <input type="number" id="a" placeholder="Enter amount">

        <label>Category</label>
        <select id="c">
            <option>Food</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Travel</option>
            <option>Others</option>
        </select>

        <label>Date</label>
        <input type="date" id="d">

        <button id="ae">Add Expense</button>

    </div>

    <div class="summary">
        <h2>Total Expense</h2>
        <h3>₹ <span id="te">0</span></h3>
    </div>

    <div class="table-box">

        <table>

            <thead>
                <tr>
                    <th>Expense Name</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="tb">

            </tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
